name: Xboard Android preview

on:
  push:
    branches: [feat/xboard-android-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xboard-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The native version string looks up the remote branch containing the pinned core.
      - name: Check out the full Mihomo submodule history
        run: git submodule update --init --recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Install and patch the MetaCubeX Go toolchain
        run: |
          curl --fail --location --retry 3 https://github.com/MetaCubeX/go/releases/download/build/go1.26.linux-amd64.tar.gz -o "$RUNNER_TEMP/go.tar.gz"
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          cd "$RUNNER_TEMP/go"
          for patch_file in "$GITHUB_WORKSPACE"/.github/patch/*.patch; do
            patch -p1 < "$patch_file"
          done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: xboard-go-1.26-${{ runner.os }}-${{ hashFiles('**/go.sum', '.github/patch/*') }}

      - name: Configure the preview build
        env:
          PREVIEW_KEYSTORE: ${{ secrets.XBOARD_PREVIEW_KEYSTORE }}
          PREVIEW_PASSWORD: ${{ secrets.XBOARD_PREVIEW_PASSWORD }}
        run: |
          umask 077
          test -n "$PREVIEW_KEYSTORE" && test -n "$PREVIEW_PASSWORD"
          printf '%s' "$PREVIEW_KEYSTORE" | base64 --decode > release.keystore
          printf 'keystore.password=%s\nkey.alias=preview\nkey.password=%s\n' "$PREVIEW_PASSWORD" "$PREVIEW_PASSWORD" > signing.properties
          printf 'custom.application.id=im.iil.ikun.clashpreview\nremove.suffix=true\n' > local.properties
          cp /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Build the arm64-v8a release APK
        id: build
        run: |
          ./gradlew --no-daemon app:downloadGeoFiles
          ./gradlew --no-daemon -Pxboard.arm64Preview=true app:assembleAlphaRelease -x app:downloadGeoFiles

      - name: Verify the preview identity and signature
        run: |
          shopt -s nullglob
          apk=(app/build/outputs/apk/alpha/release/*.apk)
          test "${#apk[@]}" -eq 1
          tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools_dir/aapt" dump badging "${apk[0]}" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='im.iil.ikun.clashpreview' versionCode='211040' versionName='2.11.36-preview.5'" "$RUNNER_TEMP/badging.txt"
          grep -Fx "native-code: 'arm64-v8a'" "$RUNNER_TEMP/badging.txt"
          "$tools_dir/apksigner" verify --verbose --print-certs "${apk[0]}" > "$RUNNER_TEMP/signature.txt"
          grep -Fx 'Number of signers: 1' "$RUNNER_TEMP/signature.txt"
          grep -Fi 'certificate SHA-256 digest: 835aafbfc4970c9f2ce5d8f3bcb7dd2f464b7e70d2ff878f70b9ee63a3125f62' "$RUNNER_TEMP/signature.txt"
          mkdir -p dist
          cp "${apk[0]}" dist/IKUN-Xboard-preview.5-arm64-v8a.apk
          cd dist && sha256sum *.apk > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: IKUN-Xboard-Android-preview-arm64-v8a
          path: dist/
          if-no-files-found: error
          compression-level: 0

      - name: Retain the APK for troubleshooting when verification fails
        if: failure() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: xboard-verification-diagnostic
          path: app/build/outputs/apk/alpha/release/*.apk
          retention-days: 1
          compression-level: 0
